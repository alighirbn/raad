<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الوصولات والتقارير</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mut:#6b7785;--pri:#1565c0;--bd:#dde3ea;--ok:#2e7d32;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#161b22;--card:#1f2630;--tx:#e6edf3;--mut:#9aa7b4;--pri:#64a8ff;--bd:#323b47;--ok:#6fcf74;--bad:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pri);color:#fff;padding:12px 16px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap}
nav button{flex:1;min-width:110px}
main{max-width:980px;margin:0 auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
input,button,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
button.tab.on{background:var(--pri);color:#fff}
button.x{color:var(--bad);padding:4px 9px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row label{flex:1;min-width:140px;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--bd);padding:6px;text-align:right;font-size:14px}
th{color:var(--mut);font-weight:600}
td input{width:100%;min-width:70px}
.num{direction:ltr;text-align:left}
.total{font-size:20px;font-weight:700;text-align:left;padding:10px 0}
.new{color:var(--ok);font-size:12px}
.wrap{overflow-x:auto}
#msg{position:fixed;bottom:14px;left:14px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;display:none}
.pos{color:var(--ok)}.neg{color:var(--bad)}
</style>
</head>
<body>
<header><span>📄 الوصولات والتقارير</span><button onclick="load()">🔄 تحديث</button></header>
<nav>
  <button class="tab on" data-t="new">وصل جديد</button>
  <button class="tab" data-t="list">الوصولات</button>
  <button class="tab" data-t="rep">تقرير المواد</button>
  <button class="tab" data-t="mov">حركة مادة</button>
</nav>
<main>

<section id="new" class="card">
  <div class="row">
    <label>المجهز<input id="sup" list="supList"></label>
    <label>العدد (رقم الوصل)<input id="num"></label>
    <label>التاريخ<input id="dt" type="date"></label>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>المادة</th><th>الكمية</th><th>المبلغ (سعر الوحدة)</th><th>المجموع</th><th></th></tr></thead>
    <tbody id="lines"></tbody>
  </table></div>
  <div class="row" style="margin-top:10px"><button onclick="addLine()">+ سطر</button></div>
  <div class="total">المجموع النهائي: <span id="grand">0</span></div>
  <div class="row">
    <button class="p" onclick="saveReceipt()">💾 حفظ الوصل</button>
    <button onclick="resetForm()">وصل جديد / إلغاء التعديل</button>
  </div>
  <datalist id="matList"></datalist><datalist id="supList"></datalist>
</section>

<section id="list" class="card" hidden>
  <div class="wrap"><table>
    <thead><tr><th>التاريخ</th><th>العدد</th><th>المجهز</th><th>المجموع</th><th></th></tr></thead>
    <tbody id="rcpts"></tbody>
  </table></div>
</section>

<section id="rep" class="card" hidden>
  <div class="row">
    <label>من تاريخ<input id="rf" type="date" onchange="renderRep()"></label>
    <label>إلى تاريخ<input id="rt" type="date" onchange="renderRep()"></label>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>المادة</th><th>إجمالي الكمية</th><th>إجمالي المبلغ</th></tr></thead>
    <tbody id="repBody"></tbody>
  </table></div>
</section>

<section id="mov" class="card" hidden>
  <div class="row"><label>المادة<input id="mm" list="matList" onchange="renderMov()" oninput="renderMov()"></label></div>
  <div class="wrap"><table>
    <thead><tr><th>التاريخ</th><th>الوصل</th><th>المجهز</th><th>الكمية</th><th>السعر</th><th>المبلغ</th><th>الكمية التراكمية</th><th>المبلغ التراكمي</th></tr></thead>
    <tbody id="movBody"></tbody>
  </table></div>
</section>
</main>
<div id="msg"></div>

<script>
// ضع هنا رابط الـ Web App بعد النشر في Apps Script
const API = "https://script.google.com/macros/s/AKfycbxdsdMaCzhXZz3qiievhlSnBOcAQd_KpltJ7qE9rifW3DSkZrpAkov9s8gNg6i1JNot/exec";

let DB = {materials:[], receipts:[], lines:[]}, editId = null;
const $ = id => document.getElementById(id);
const n = v => Number(v) || 0;
const fmt = v => n(v).toLocaleString('en-US', {maximumFractionDigits:2});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)}

async function load(){
  try{
    const r = await fetch(API); DB = await r.json();
    refreshAll();
  }catch(e){toast('تعذر تحميل البيانات: تحقق من رابط API')}
}
async function post(body){
  const opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)};
  try{
    const r = await fetch(API,opt);
    const j = await r.json(); if(!j.ok) throw new Error(j.error); return j;
  }catch(e){
    if(!(e instanceof TypeError)) throw e;
    // احتياط: بعض المتصفحات تمنع قراءة الرد، لكن الإرسال ينجح. نرسل بوضع no-cors ونتحقق بعدها بالتحميل
    await fetch(API,{...opt,mode:'no-cors'});
    return {ok:true,opaque:true};
  }
}

// ---- التبويبات
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  ['new','list','rep','mov'].forEach(t=>$(t).hidden = t!==b.dataset.t);
});

// ---- الوصل
function addLine(d={}){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input class="m" list="matList" value="${esc(d.material)}" oninput="chk(this)"><div class="new"></div></td>
  <td><input class="q num" type="number" step="any" value="${d.qty??''}" oninput="calc()"></td>
  <td><input class="p num" type="number" step="any" value="${d.price??''}" oninput="calc()"></td>
  <td class="num t">0</td>
  <td><button class="x" onclick="this.closest('tr').remove();calc()">✕</button></td>`;
  $('lines').appendChild(tr); chk(tr.querySelector('.m')); calc();
}
function chk(inp){
  const v=inp.value.trim(), el=inp.nextElementSibling;
  el.textContent = v && !DB.materials.includes(v) ? '＋ مادة جديدة (ستُضاف تلقائياً عند الحفظ)' : '';
}
function calc(){
  let g=0;
  document.querySelectorAll('#lines tr').forEach(tr=>{
    const t=n(tr.querySelector('.q').value)*n(tr.querySelector('.p').value);
    tr.querySelector('.t').textContent=fmt(t); g+=t;
  });
  $('grand').textContent=fmt(g);
}
function resetForm(){
  editId=null; $('sup').value=''; $('num').value=''; $('dt').value=new Date().toISOString().slice(0,10);
  $('lines').innerHTML=''; addLine();
}
async function saveReceipt(){
  const lines=[...document.querySelectorAll('#lines tr')].map(tr=>{
    const q=n(tr.querySelector('.q').value), p=n(tr.querySelector('.p').value);
    return {material:tr.querySelector('.m').value.trim(), qty:q, price:p, total:q*p};
  }).filter(l=>l.material);
  if(!lines.length) return toast('أضف مادة واحدة على الأقل');
  if(!$('dt').value) return toast('حدد التاريخ');
  const receipt={id:editId||String(Date.now()), number:$('num').value.trim(), supplier:$('sup').value.trim(),
                 date:$('dt').value, total:lines.reduce((s,l)=>s+l.total,0)};
  try{ toast('جارٍ الحفظ...'); await post({action:'saveReceipt',receipt,lines}); await new Promise(r=>setTimeout(r,1500)); await load();
    if(!DB.receipts.some(x=>x.id===receipt.id)) throw new Error('لم يصل الوصل للسبريدشيت، تحقق من نشر السكربت');
    resetForm(); toast('تم الحفظ ✓'); }
  catch(e){ toast('فشل الحفظ: '+e.message) }
}

// ---- القوائم والتقارير
function refreshAll(){
  $('matList').innerHTML=DB.materials.map(m=>`<option value="${esc(m)}">`).join('');
  $('supList').innerHTML=[...new Set(DB.receipts.map(r=>r.supplier).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('');
  const rs=[...DB.receipts].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  $('rcpts').innerHTML=rs.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.number)}</td><td>${esc(r.supplier)}</td><td class="num">${fmt(r.total)}</td>
   <td><button onclick="editR('${r.id}')">تعديل</button> <button class="x" onclick="delR('${r.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan=5>لا توجد وصولات</td></tr>';
  document.querySelectorAll('#lines .m').forEach(chk);
  renderRep(); renderMov();
}
function editR(id){
  const r=DB.receipts.find(x=>x.id===id); editId=id;
  $('sup').value=r.supplier; $('num').value=r.number; $('dt').value=r.date; $('lines').innerHTML='';
  DB.lines.filter(l=>l.receiptId===id).forEach(l=>addLine({material:l.material,qty:l.qty,price:l.price}));
  document.querySelector('[data-t=new]').click(); scrollTo(0,0);
}
async function delR(id){
  if(!confirm('حذف هذا الوصل؟')) return;
  try{ await post({action:'deleteReceipt',id}); await new Promise(r=>setTimeout(r,1500)); await load(); toast('تم الحذف'); }catch(e){toast('فشل: '+e.message)}
}
function renderRep(){
  const f=$('rf').value,t=$('rt').value,agg={};
  DB.lines.filter(l=>(!f||l.date>=f)&&(!t||l.date<=t)).forEach(l=>{
    const a=agg[l.material]??={q:0,s:0}; a.q+=n(l.qty); a.s+=n(l.total);
  });
  const ks=Object.keys(agg).sort(); let tq=0,ts=0;
  $('repBody').innerHTML=ks.map(k=>{tq+=agg[k].q;ts+=agg[k].s;
    return `<tr><td>${esc(k)}</td><td class="num">${fmt(agg[k].q)}</td><td class="num">${fmt(agg[k].s)}</td></tr>`}).join('')
   + (ks.length?`<tr><th>الإجمالي</th><th class="num">${fmt(tq)}</th><th class="num">${fmt(ts)}</th></tr>`:'<tr><td colspan=3>لا توجد بيانات</td></tr>');
}
function renderMov(){
  const m=$('mm').value.trim(); let cq=0,cs=0;
  const rows=DB.lines.filter(l=>l.material===m).sort((a,b)=>a.date.localeCompare(b.date)||a.receiptId.localeCompare(b.receiptId));
  $('movBody').innerHTML=rows.map(l=>{cq+=n(l.qty);cs+=n(l.total);
    return `<tr><td>${esc(l.date)}</td><td>${esc(l.number)}</td><td>${esc(l.supplier)}</td><td class="num">${fmt(l.qty)}</td>
    <td class="num">${fmt(l.price)}</td><td class="num">${fmt(l.total)}</td><td class="num pos">${fmt(cq)}</td><td class="num pos">${fmt(cs)}</td></tr>`}).join('')
   || `<tr><td colspan=8>${m?'لا توجد حركة لهذه المادة':'اختر مادة'}</td></tr>`;
}

resetForm(); load();
</script>
</body>
</html>
